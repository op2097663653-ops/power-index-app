name: Build APK
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Download project
        run: |
          curl -L -o android-webview.zip https://power-index-cn.netlify.app/android-webview.zip
          unzip -q android-webview.zip
      - name: Build APK
        run: gradle -p android-webview assembleRelease --no-daemon
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 战力图鉴 build ${{ github.run_number }}
          files: android-webview/app/build/outputs/apk/release/app-release.apk
      - name: Upload mirror
        continue-on-error: true
        run: |
          APK=android-webview/app/build/outputs/apk/release/app-release.apk
          URL=$(curl -sF "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php || true)
          echo "mirror: $URL" >> $GITHUB_STEP_SUMMARY
      - name: Summary
        run: |
          echo "APK: https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-release.apk" >> $GITHUB_STEP_SUMMARY
