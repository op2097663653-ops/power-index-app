name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Download project
        run: |
          curl -L -o android-webview.zip https://power-index-cn.netlify.app/android-webview.zip
          unzip -q android-webview.zip
      - name: Build APK
        run: gradle -p android-webview assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: power-index-apk
          path: android-webview/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
